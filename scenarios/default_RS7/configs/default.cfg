# This file defines the simbev parameters

[basic]
# basic parameters for the simulation
# ===========================
# input_type: choose what kind of input is used for driving profiles (Options: probability or profile)
# input_directory: specify where the input data is located
# eta_cp: efficiency of charging points
# stepsize: step size of simulation in minutes (should stay at 15 min, best results)
# start_date/end_date: start and end date of simulation in format YYYY-MM-DD
# soc_min: minimum SoC left after a drive (0-1)
# charging_threshold: vehicles with a SoC above this value (0-1) do not attempt to charge

input_type = probability
input_directory = data/probability
eta_cp =  1
stepsize = 15
start_date = 2021-09-17
end_date = 2021-09-30
soc_min = 0.2
charging_threshold = 0.8


[output]
# vehicle_csv: decide if you want a output csv-file for each car simulated
# grid_time_series_csv: decide if you want a output csv-file for all cars per uc
# plot_grid_time_series_split: decide if you want a plot png-file for each region simulated
# plot_grid_time_series_collective: decide if you want a plot png-file for all regions simulated in one plot
# analyze: decide if you want an additional analysis csv-file with computed key figures
# timing: debug option to log the runtime of the simulation
vehicle_csv = true
grid_time_series_csv = true
plot_grid_time_series_split = false
plot_grid_time_series_collective = false
analyze = false
timing = false


[rampup_ev]
# rampup: number of EVs per vehicle type and region

rampup = regions.csv


[tech_data]
# tech data for EVs
# tech_data: either includes set values for slow and fast charging or is based on probability
# charging_curve: SoC-dependent charging curve per vehicle type
tech_data = tech_data.csv
# tech_data = tech_data_by_probability.csv
charging_curve = charging_curve.csv

[user_data]
# user_groups: attractivity of the charging use cases per user group
user_groups = user_groups.csv

[charging_probabilities]
# charging probabilities for all locations
# slow: charging power probabilities per location (non-hpc)
# fast: charging power probabilities for hpc (urban/ex-urban)
# use_case: optional, charging power probabilities per use case (replaces the location based values)
# home_work_private: share of private charging infrastructure at home/work, 1 equals 100%
# energy_min: minimum energy to be charged per use case
slow = charging_probability.csv
fast = fast_charging_probability.csv
# use_case = charging_probability_by_usecase.csv
home_work_private = home_work_private.csv
energy_min = energy_min.csv

[sim_params]
# simulation parameters
# scaling: a scaling of 10 will calulate only 1/10th of the cars. Outputs are always based on input amounts
# num_threads: number of threads to use for multiprocessing (max 1 per region)
# seed: rng seed. Same inputs with same options, same seed and same SimBEV version should lead to the same result
# driving_profile_seed: seed for selecting driving profiles (only for input_type = profile)
# private_only_run: Attempt to charge each vehicle only with private charging infrastructure. Only use public charging if necessary
scaling = 1
num_threads = 4
seed = 3
driving_profile_seed = 10
private_only_run = false

[hpc]
# high power charging parameters (formerly hpc_config.csv)
# soc_end_min/soc_end_max: range of the target SoC of a fast charging event
# soc_start_threshold: SoC below which a fast charging event during parking is considered
# park_time_max: maximum parking time in minutes for a fast charging event during parking
# distance_min/distance_max: share of the remaining range that is driven before an en-route fast charging stop
# mcs_power: MCS (Megawatt Charging System) power in kW, only for en-route stops of heavy duty vehicles
# mcs_time_threshold: duration of an en-route hpc stop in minutes above which heavy duty vehicles use MCS instead
soc_end_min = 0.8
soc_end_max = 0.95
soc_start_threshold = 0.6
park_time_max = 90
distance_min = 0.6
distance_max = 1
mcs_power = 1000
mcs_time_threshold = 45

[extended settings]
# optional parameters, default values are used if not set
# distance_threshold_extra_urban: distance in km above which a drive is seen as extra urban
# consumption_factor_winter: multiplicative consumption factor applied during winter months (Dec-Feb)
# consumption_factor_summer: multiplicative consumption factor applied during summer months (Jun-Aug)
# consumption_speed_optimal: driving speed in km/h at which consumption is lowest
# consumption_speed_coefficient_low: coefficient of the speed-consumption curve for speeds at or below consumption_speed_optimal
# consumption_speed_coefficient_high: coefficient of the speed-consumption curve for speeds above consumption_speed_optimal
# dc_power_threshold: charging power in kW above which charging is considered as fast (DC) charging
# threshold_retail_limitation: time of day in hours until which retail charging is possible
# threshold_street_night_limitation: time of day in hours from which street charging is treated as night charging
# maximum_park_time_flag: charging events are only started if the parking event isn't longer than the maximum_park_time
# maximum_park_time: maximum public park time in hours (requires maximum_park_time_flag = True)
# street_night_charging_flag: allow street night charging, overrides maximum_park_time for night events
# home_night_charging_flag: only allow night street charging at home (not other locations)
# night_departure_time: mean departure time in hours after a night charging event
# night_departure_standard_deviation: standard deviation of night_departure_time in hours

distance_threshold_extra_urban = 50
consumption_factor_winter = 1.15
consumption_factor_summer = 0.95
consumption_speed_optimal = 50
consumption_speed_coefficient_low = 0.00001
consumption_speed_coefficient_high = 0.00004
dc_power_threshold = 50
threshold_retail_limitation = 21
threshold_street_night_limitation = 21
maximum_park_time_flag = False
maximum_park_time = 10
street_night_charging_flag = True
home_night_charging_flag = False
night_departure_standard_deviation = 1
night_departure_time = 9
